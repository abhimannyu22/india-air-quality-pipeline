name: Daily pipeline

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 7:00 AM IST, every day
  workflow_dispatch:        # also adds a "Run workflow" button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The key comes from the GitHub secret, never from the code
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare data folder
        run: mkdir -p data

      - name: Ingest stations
        run: python src/fetch_locations.py
      - name: Select active stations
        run: python src/select_stations.py
      - name: Ingest measurements
        run: python src/fetch_measurements.py
      - name: Load bronze and silver
        run: python src/load_duckdb.py

      - name: dbt seed, run, test
        working-directory: dbt_project
        run: |
          dbt seed
          dbt run
          dbt test

      - name: Save the database
        uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: data/warehouse.duckdb
          retention-days: 7